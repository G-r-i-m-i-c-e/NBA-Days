<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>NBA STATS</title><style>body{margin:0;background:#0b1220;color:#e9efff;font:15px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:25px 18px 12px;background:#14223b}h1{margin:0;font-size:27px}small,.muted{color:#9faec8}.wrap{max-width:850px;margin:auto;padding:15px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.days button{background:#1c2a43;border:1px solid #35445e;color:white;border-radius:10px;padding:10px 0}.days button.on{background:#2862c3}.card{background:#17243a;border:1px solid #33415b;border-radius:14px;margin:12px 0;padding:15px}.game{width:100%;color:inherit;text-align:left;cursor:pointer}.teams{display:flex;justify-content:space-between;align-items:center;gap:8px}.score{font-size:22px;font-weight:bold}.label{font-size:12px;color:#aebbd0}.btn{border:1px solid #435775;background:#263c61;color:white;border-radius:9px;padding:9px 13px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.scroll{overflow:auto}table{border-collapse:collapse;white-space:nowrap;font-size:12px;width:100%}td,th{border-bottom:1px solid #39465d;padding:9px 7px;text-align:right}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#17243a}select{background:#263c61;color:white;border:1px solid #526480;border-radius:7px;padding:7px}#notice{color:#ffcb88;font-size:12px;line-height:1.6}</style></head><body><header><div style="max-width:850px;margin:auto"><h1>NBA STATS</h1><small>七天赛程 · 实时比分 · 完整球员数据</small></div></header><main class="wrap"><div class="row"><strong id="dateTitle"></strong><button class="btn" id="refresh">刷新</button></div><div class="days" id="days"></div><p id="notice"></p><div id="content"></div><small>来源：NBA
